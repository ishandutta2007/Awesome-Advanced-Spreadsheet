<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Animated Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#10b981;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#f43f5e;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#34d399;#f59e0b;#8b5cf6;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatPill1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatPill2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes beamMove {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1300px); }
      }
      @keyframes cellShine {
        0%, 100% { fill-opacity: 0.08; }
        50% { fill-opacity: 0.28; }
      }
      .grid-layer { animation: pulseGrid 6s ease-in-out infinite; }
      .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
      .pill-2 { animation: floatPill2 4.5s ease-in-out infinite; }
      .pill-3 { animation: floatPill1 5s ease-in-out infinite 0.5s; }
      .pill-4 { animation: floatPill2 4.2s ease-in-out infinite 0.8s; }
      .pill-5 { animation: floatPill1 4.8s ease-in-out infinite 1.2s; }
      .beam-line { animation: beamMove 5s linear infinite; }
      .cell-highlight { animation: cellShine 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="360" fill="url(#cyanGlow)" />
  <rect width="1200" height="360" fill="url(#purpleGlow)" />
  <rect width="1200" height="360" fill="url(#emeraldGlow)" />

  <!-- Background Decorative Spreadsheet Grid (Depth Layer) -->
  <g class="grid-layer" stroke="#334155" stroke-width="1" stroke-opacity="0.35">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="50" x2="1200" y2="50" stroke-dasharray="4,6" />
    <line x1="0" y1="110" x2="1200" y2="110" stroke-dasharray="4,6" />
    <line x1="0" y1="170" x2="1200" y2="170" stroke-dasharray="4,6" />
    <line x1="0" y1="230" x2="1200" y2="230" stroke-dasharray="4,6" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke-dasharray="4,6" />

    <!-- Vertical Grid Lines -->
    <line x1="120" y1="0" x2="120" y2="360" stroke-dasharray="4,6" />
    <line x1="280" y1="0" x2="280" y2="360" stroke-dasharray="4,6" />
    <line x1="440" y1="0" x2="440" y2="360" stroke-dasharray="4,6" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4,6" />
    <line x1="760" y1="0" x2="760" y2="360" stroke-dasharray="4,6" />
    <line x1="920" y1="0" x2="920" y2="360" stroke-dasharray="4,6" />
    <line x1="1080" y1="0" x2="1080" y2="360" stroke-dasharray="4,6" />
  </g>

  <!-- Glowing Active Spreadsheet Cells (Subtle background details) -->
  <rect class="cell-highlight" x="120" y="50" width="160" height="60" fill="#38bdf8" rx="4" />
  <rect class="cell-highlight" x="760" y="110" width="160" height="60" fill="#818cf8" rx="4" style="animation-delay: 1.2s;" />
  <rect class="cell-highlight" x="440" y="230" width="160" height="60" fill="#10b981" rx="4" style="animation-delay: 2.1s;" />

  <!-- Animated Data Ray / Laser Beam along Grid Line -->
  <g opacity="0.7">
    <rect class="beam-line" y="229" width="300" height="2" fill="url(#titleGrad)" filter="url(#glow)" />
  </g>

  <!-- Dynamic Curved Bottom Vector Graphic -->
  <path d="M0,320 C300,300 500,345 750,315 C950,290 1100,335 1200,310 L1200,360 L0,360 Z" fill="url(#waveGrad)" opacity="0.25" />
  <path d="M0,335 C250,320 550,355 800,330 C1000,310 1120,345 1200,330 L1200,360 L0,360 Z" fill="url(#waveGrad)" opacity="0.35" />

  <!-- Floating Feature Pills (Positioned in lower quadrant so they NEVER overlap title/subtitle) -->
  <g id="interactive-pills">
    <!-- Pill 1: Relational Data -->
    <g class="pill-1" transform="translate(60, 275)">
      <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔗 Relational Tables</text>
    </g>

    <!-- Pill 2: Python & SQL -->
    <g class="pill-2" transform="translate(270, 275)">
      <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="17" r="5" fill="#818cf8" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🐍 Python &amp; SQL Cells</text>
    </g>

    <!-- Pill 3: No-Code & Automation -->
    <g class="pill-3" transform="translate(470, 275)">
      <rect width="195" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="17" r="5" fill="#34d399" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ No-Code Automations</text>
    </g>

    <!-- Pill 4: Open-Source First -->
    <g class="pill-4" transform="translate(685, 275)">
      <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="17" r="5" fill="#f472b6" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 20+ Open-Source</text>
    </g>

    <!-- Pill 5: Market Intelligence -->
    <g class="pill-5" transform="translate(895, 275)">
      <rect width="245" height="34" rx="17" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="17" r="5" fill="#fbbf24" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 SaaS Valuation &amp; Pricing</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Brand Icon, Main Title, and Subtitle (Strictly drawn last for absolute prominence) -->
  <g id="foreground-content" filter="url(#shadow)">
    <!-- Category Mini-Badge -->
    <g transform="translate(600, 68)">
      <rect x="-120" y="-16" width="240" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <text text-anchor="middle" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
      Awesome Advanced Spreadsheet
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      Curated Landscape of Relational Databases, Programmable Grids &amp; Modern Spreadsheets
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="220" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      SaaS Market Intelligence • Open-Source Self-Hosted Alternatives • Python &amp; SQL Engines • Real-Time Collaboration
    </text>
  </g>
</svg>
